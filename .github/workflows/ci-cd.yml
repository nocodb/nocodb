name: "CI/CD"
on:
  push:
    branches: [develop]
    paths:
      - "packages/nc-gui/**"
      - "packages/nocodb/**"
      - ".github/workflows/ci-cd.yml"
      - "tests/playwright/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    paths:
      - "packages/nc-gui/**"
      - "packages/nocodb/**"
      - ".github/workflows/ci-cd.yml"
      - ".github/workflows/playwright-test-workflow.yml"
      - "tests/playwright/**"
  workflow_call:
    inputs:
      force:
        required: false
        type: boolean
  # Triggered manually
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect dependency / integration changes (gates warm-integrations) ──

  detect-changes:
    runs-on: ubicloud-standard-2
    outputs:
      integrations: ${{ steps.filter.outputs.integrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integrations:
              - 'pnpm-lock.yaml'
              - 'packages/noco-integrations/**'

  # ── Warm the integrations cache ONCE, only when the lockfile or
  #    noco-integrations sources changed. Unit tests gate on this job; when it
  #    is skipped (no relevant changes) they start immediately and each restores
  #    the existing integrations cache instead of cold-building in parallel. ──

  warm-integrations:
    needs: detect-changes
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.integrations == 'true' || github.event_name == 'workflow_dispatch' || inputs.force == true) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.force == true || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || contains(github.event.pull_request.labels.*.name, 'backend') || contains(github.event.pull_request.labels.*.name, 'mssql')) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: 'pnpm'
      - name: Ensure pnpm store dir exists
        run: mkdir -p "$(pnpm store path)"
      - name: Set CI env
        run: export CI=true
      - name: Set NC Edition
        run: export EE=true
      - name: Cache integrations (node_modules + dists)
        uses: actions/cache@v5
        with:
          path: |
            packages/noco-integrations/node_modules
            packages/noco-integrations/packages/*/node_modules
            packages/noco-integrations/packages/*/dist
            packages/noco-integrations/core/dist
            packages/noco-integrations/.build-checksums.json
          key: integrations-${{ hashFiles('packages/noco-integrations/pnpm-lock.yaml', 'packages/noco-integrations/packages/*/src/**', 'packages/noco-integrations/core/src/**', 'packages/noco-integrations/packages/*/package.json') }}
          restore-keys: |
            integrations-
      - name: install dependencies (warms pnpm store + integrations cache)
        run: pnpm bootstrap

  # ── Unit Tests (gate on warm-integrations; independent of UI pre-build) ──

  jest-unit-test:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/jest-unit-test.yml
    secrets: inherit

  unit-tests-sqlite:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-sqlite.yml
    secrets: inherit
    with:
      test_set: 1
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-sqlite-2:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-sqlite.yml
    secrets: inherit
    with:
      test_set: 2
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-sqlite-3:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (inputs.force == true || (contains(github.event.pull_request.labels.*.name, 'backend') && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci')))) }}
    uses: ./.github/workflows/unit-test-sqlite.yml
    secrets: inherit
    with:
      test_set: 3
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-pg.yml
    secrets: inherit
    with:
      test_set: 1
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-2:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-pg.yml
    secrets: inherit
    with:
      test_set: 2
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-3:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (inputs.force == true || (contains(github.event.pull_request.labels.*.name, 'backend') && (github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci')))) }}
    uses: ./.github/workflows/unit-test-pg.yml
    secrets: inherit
    with:
      test_set: 3
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-reflection:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (inputs.force == true || (contains(github.event.pull_request.labels.*.name, 'backend') && (github.event_name == 'push' || !github.event.pull_request.draft))) }}
    uses: ./.github/workflows/unit-test-pg.yml
    secrets: inherit
    with:
      reflection: true
      test_set: 1
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-reflection-2:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (inputs.force == true || (contains(github.event.pull_request.labels.*.name, 'backend') && (github.event_name == 'push' || !github.event.pull_request.draft))) }}
    uses: ./.github/workflows/unit-test-pg.yml
    secrets: inherit
    with:
      reflection: true
      test_set: 2
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-reflection-3:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (inputs.force == true || (contains(github.event.pull_request.labels.*.name, 'backend') && (github.event_name == 'push' || !github.event.pull_request.draft))) }}
    uses: ./.github/workflows/unit-test-pg.yml
    secrets: inherit
    with:
      reflection: true
      test_set: 3
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  # PG meta + MSSQL data DB. Always runs on push-to-develop so post-merge
  # regressions are caught immediately; opt-in on PRs via the `mssql` label
  # (or `trigger-ci` / force) to keep the MSSQL container cost off PRs that
  # don't touch the dialect.
  unit-tests-pg-mssql:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'mssql') || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-pg-mssql.yml
    secrets: inherit
    with:
      test_set: 1
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-mssql-2:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'mssql') || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-pg-mssql.yml
    secrets: inherit
    with:
      test_set: 2
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  unit-tests-pg-mssql-3:
    needs: warm-integrations
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'mssql') || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true) }}
    uses: ./.github/workflows/unit-test-pg-mssql.yml
    secrets: inherit
    with:
      test_set: 3
      mem_log: ${{ contains(github.event.pull_request.labels.*.name, 'mem-log') }}

  # ── Pre-build UI (single job builds EE always, CE on develop push) ──

  pre-build-for-ci:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true }}
    uses: ./.github/workflows/pre-build-for-ci.yml
    secrets: inherit
    with:
      build_ce: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}

  # ── Playwright E2E: PostgreSQL EE (always on PR + push, 3 shards) ──

  playwright-pg-shard-1:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: pg
      shard: 1

  playwright-pg-shard-2:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: pg
      shard: 2

  playwright-pg-shard-3:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || (github.event.pull_request.base.ref == 'develop' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'trigger-ci') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: pg
      shard: 3

  # ── Playwright E2E: SQLite CE (develop push or 'pw-all' label) ────

  playwright-sqlite-1:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: sqlite
      shard: 1
      ee: false

  playwright-sqlite-2:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: sqlite
      shard: 2
      ee: false

  playwright-sqlite-3:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: sqlite
      shard: 3
      ee: false

  # ── Playwright E2E: MySQL CE (develop push or 'pw-all' label) ─────

  playwright-mysql-1:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: mysql
      shard: 1
      ee: false

  playwright-mysql-2:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: mysql
      shard: 2
      ee: false

  playwright-mysql-3:
    needs: pre-build-for-ci
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pw-all') || inputs.force == true }}
    uses: ./.github/workflows/playwright-test-workflow.yml
    secrets: inherit
    with:
      db: mysql
      shard: 3
      ee: false
