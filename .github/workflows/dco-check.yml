# Path inclusion/ exclusions:
#   https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#excluding-paths

name: Check DCO
on:
  pull_request:
    paths:
      - "packages/nocodb-sdk/**"
      - "packages/nc-gui/**"
      - "packages/nc-lib-gui/**"
      - "packages/nocodb/**"

jobs:
  commits_check_job:
    runs-on: ubuntu-22.04
    name: Commits Check
    steps:
      - name: Get PR Commits
        id: "get-pr-commits"
        uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: DCO Check
        uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21 # master
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
