name: "NestJS Unit Test"
on:
  push:
    branches: [develop]
    paths:
      - "packages/nocodb/**"
      - ".github/workflows/jest-unit-test.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [develop]
    paths:
      - "packages/nocodb/**"
      - ".github/workflows/jest-unit-test.yml"
  workflow_call:
  # Triggered manually
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jest-unit-test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'trigger-CI') || !github.event.pull_request.draft || inputs.force == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: 'pnpm'
      - name: Set CI env
        run: export CI=true
      - name: Set NC Edition
        run: export EE=true
      - name: remove use-node-version line from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc
      - name: Cache integration dists
        uses: actions/cache@v4
        with:
          path: |
            packages/noco-integrations/packages/*/dist
            packages/noco-integrations/core/dist
            packages/noco-integrations/.build-checksums.json
          key: integrations-dist-${{ hashFiles('packages/noco-integrations/packages/*/src/**', 'packages/noco-integrations/core/src/**', 'packages/noco-integrations/packages/*/package.json') }}
          restore-keys: |
            integrations-dist-
      - name: install dependencies
        run: pnpm bootstrap
      - name: run unit tests
        working-directory: ./packages/nocodb
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: pnpm run test
