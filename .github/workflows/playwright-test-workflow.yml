name: Playwright test reusable workflow

on:
  workflow_call:
    inputs:
      shard:
        description: 'Shard number'
        required: true
        type: string
      db:
        required: true
        type: string
      ee:
        description: 'Run in EE mode (default: true)'
        required: false
        type: boolean
        default: true

jobs:
  playwright:
    runs-on: ubicloud-standard-4
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── Start only the required database container ─────────────
      - name: Start PostgreSQL
        if: ${{ inputs.db == 'pg' }}
        run: |
          docker run -d --name postgres \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_USER=postgres \
            -p 5432:5432 \
            postgres:17
          until docker exec postgres pg_isready -U postgres 2>/dev/null; do sleep 2; done

      - name: Create PG Sakila template database
        if: ${{ inputs.db == 'pg' }}
        run: |
          docker cp packages/nocodb/tests/pg-sakila-db/01-postgres-sakila-schema.sql postgres:/tmp/
          docker cp packages/nocodb/tests/pg-sakila-db/02-postgres-sakila-insert-data.sql postgres:/tmp/
          docker exec postgres psql -U postgres -c "CREATE DATABASE sakila_template;"
          docker exec postgres psql -U postgres -d sakila_template --single-transaction -f /tmp/01-postgres-sakila-schema.sql
          docker exec postgres psql -U postgres -d sakila_template --single-transaction -f /tmp/02-postgres-sakila-insert-data.sql

      - name: Start MySQL
        if: ${{ inputs.db == 'mysql' }}
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=password \
            -p 3306:3306 \
            mysql:8
          until docker exec mysql mysqladmin ping -h localhost --silent 2>/dev/null; do sleep 3; done

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: 'pnpm'

      - name: Set CI env
        run: export CI=true

      - name: Set NC Edition
        run: export EE=true

      - name: remove use-node-version line from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc

      - name: Cache integrations (node_modules + dists)
        uses: actions/cache@v5
        with:
          path: |
            packages/noco-integrations/node_modules
            packages/noco-integrations/packages/*/node_modules
            packages/noco-integrations/packages/*/dist
            packages/noco-integrations/core/dist
            packages/noco-integrations/.build-checksums.json
          key: integrations-${{ hashFiles('packages/noco-integrations/pnpm-lock.yaml', 'packages/noco-integrations/packages/*/src/**', 'packages/noco-integrations/core/src/**', 'packages/noco-integrations/packages/*/package.json') }}
          restore-keys: |
            integrations-
      - name: install dependencies
        run: pnpm bootstrap

      - name: Setup mysql
        if: ${{ inputs.db == 'mysql' }}
        working-directory: ./packages/nocodb/tests/mysql-sakila-db
        run: |
          # Get a list of non-system databases and drop them
          MYSQL_PWD=password mysql -h 127.0.0.1 -u'root' -e "SHOW DATABASES" --skip-column-names | grep -Ev "(information_schema|mysql|performance_schema|sys)" | while read db; do
            MYSQL_PWD=password mysql -h 127.0.0.1 -u'root' -e "DROP DATABASE IF EXISTS \`$db\`";
          done
          # keep sql_mode default except remove "STRICT_TRANS_TABLES"
          MYSQL_PWD=password mysql -h 127.0.0.1 -u'root' -e "SET GLOBAL sql_mode = 'ONLY_FULL_GROUP_BY,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';"
          # this is only needed for connecting to sakila db as its referred in multiple places in test code
          MYSQL_PWD=password mysql -h 127.0.0.1 -u'root' < 01-mysql-sakila-schema.sql
          MYSQL_PWD=password mysql -h 127.0.0.1 -u'root' < 02-mysql-sakila-insert-data.sql

      - name: Setup pg for quick tests
        if: ${{ inputs.ee && inputs.db == 'sqlite' && inputs.shard == '1' }}
        working-directory: ./packages/nocodb/tests/pg-cy-quick/
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -f 01-cy-quick.sql

      - name: run sql-executor
        working-directory: ./packages/nc-sql-executor
        run: |
          pnpm run dev &

      - name: Install dependencies of sso idp
        if: ${{ inputs.ee }}
        working-directory: ./scripts/ee/playwright
        run: |
          cd ./openid-provider
          npm install
          cd ../saml-provider
          npm install

      - name: Configure AWS credentials for UI download
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.ARTIFACTS_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ARTIFACTS_S3_SECRET_KEY }}
          aws-region: us-east-2

      - name: Download pre-built EE UI from S3
        if: ${{ inputs.ee }}
        working-directory: ./packages/nc-gui/
        run: |
          rm -rf ee/.output.zip ee/.output
          mkdir -p ee/.output
          FILE="$(echo ${GITHUB_REPOSITORY} | sed "s,/,-,g")-${GITHUB_RUN_ID}.zip"
          aws s3 cp s3://nocohub-ci-artifacts/ui-builds/${FILE} ./output.zip
          unzip -oq output.zip

      - name: Download pre-built CE UI from S3
        if: ${{ !inputs.ee }}
        working-directory: ./packages/nc-gui/
        run: |
          rm -rf .output.zip .output
          mkdir -p .output
          FILE="$(echo ${GITHUB_REPOSITORY} | sed "s,/,-,g")-${GITHUB_RUN_ID}-ce.zip"
          aws s3 cp s3://nocohub-ci-artifacts/ui-builds/${FILE} ./output.zip
          unzip -oq output.zip

      - name: Start frontend (EE)
        if: ${{ inputs.ee }}
        working-directory: ./packages/nc-gui/
        run: pnpm run ci:start:ee &

      - name: Start frontend (CE)
        if: ${{ !inputs.ee }}
        working-directory: ./packages/nc-gui/
        run: pnpm run ci:start &

      - name: Run backend
        if: ${{ inputs.db == 'sqlite' }}
        working-directory: ./packages/nocodb
        run: |
          pnpm run watch:run:playwright &> ${{ inputs.db }}_${{ inputs.shard }}_test_backend.log &

      - name: Run backend:mysql
        if: ${{ inputs.db == 'mysql' }}
        working-directory: ./packages/nocodb
        run: |
          pnpm run watch:run:playwright:mysql &> ${{ inputs.db }}_${{ inputs.shard }}_test_backend.log &

      - name: Run backend:pg
        if: ${{ inputs.db == 'pg' }}
        working-directory: ./packages/nocodb
        env:
          # Cap the V8 old-space at 512 MB so the OOM reproduces quickly with a
          # small (~1 GB raw, ~200 MB gzipped) heap snapshot — large enough to
          # diagnose the leak, small enough that gzip+S3 upload finishes well
          # before the runner is shut down. The leak is per-request, so a
          # smaller heap just means OOM after fewer requests with the same
          # allocation signature.
          # Dump 1 heap snapshot near the OOM limit + a sampled allocation
          # profile on process exit. Snapshots land in CWD as
          # Heap.<ts>.<pid>.<seq>.heapsnapshot; profile lands in ./heap-profiles/.
          NODE_OPTIONS: "--max-old-space-size=512 --heapsnapshot-near-heap-limit=1 --heap-prof --heap-prof-dir=./heap-profiles"
        run: |
          mkdir -p heap-profiles
          pnpm run watch:run:playwright:pg:ee &> ${{ inputs.db }}_${{ inputs.shard }}_test_backend.log &

      - name: Stream heap dumps to S3 in background
        if: ${{ inputs.db == 'pg' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          # Why this exists: the backend OOM kills the V8 process, which writes
          # a heap snapshot ~6 GB raw. With multiple snapshots and rspack
          # artifacts on top, the ubicloud runner can run out of disk and the
          # host kills the VM. When that happens, the post-job artifact upload
          # never runs and we lose the dumps.
          #
          # This streamer gzips and uploads each heap snapshot/profile as soon
          # as it appears, then deletes the original to keep disk free. It
          # runs as a background nohup process so it survives this step
          # finishing, and we capture its PID so the post-job step can stop
          # and flush it.
          s3_prefix="runs/${GITHUB_RUN_ID}/run-attempt/${GITHUB_RUN_ATTEMPT}/job_name/${GITHUB_JOB}-${{ inputs.shard }}/heap"
          echo "Heap dumps will stream to: s3://nocohub-ci-artifacts/${s3_prefix}/"

          nohup bash -c '
            set +e
            while true; do
              shopt -s nullglob
              for f in ./packages/nocodb/Heap.*.heapsnapshot \
                       ./packages/nocodb/heap-profiles/*.heapprofile \
                       ./packages/nocodb/heap-profiles/*.heapsnapshot; do
                [ -f "$f" ] || continue
                [ -f "${f}.uploaded" ] && continue

                # File may still be growing — wait until size is stable
                # for two consecutive ticks before uploading.
                s1=$(stat -c%s "$f" 2>/dev/null || echo 0)
                sleep 5
                s2=$(stat -c%s "$f" 2>/dev/null || echo 0)
                [ "$s1" = "0" ] && continue
                [ "$s1" != "$s2" ] && continue

                gzip -f "$f" && \
                  aws s3 cp "${f}.gz" "s3://nocohub-ci-artifacts/'"${s3_prefix}"'/$(basename ${f}.gz)" \
                    --no-progress --content-type "application/gzip" && \
                  rm -f "${f}.gz" && \
                  touch "${f}.uploaded"
              done
              shopt -u nullglob
              sleep 10
            done
          ' >/tmp/heap-streamer.log 2>&1 &
          echo $! > /tmp/heap-streamer.pid
          echo "Heap streamer started: PID $(cat /tmp/heap-streamer.pid)"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/playwright/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        working-directory: ./tests/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for backend
        run: |
          while ! curl --output /dev/null --silent --head --fail http://localhost:8080; do
            printf '.'
            sleep 2
          done
        timeout-minutes: 2

      - name: Run Playwright Tests (EE)
        if: ${{ inputs.ee }}
        working-directory: ./tests/playwright
        run: E2E_DB_TYPE=${{ inputs.db }} pnpm run ci:test:shard:${{ inputs.shard }} --forbid-only
        timeout-minutes: 60

      - name: Run Playwright Tests (CE)
        if: ${{ !inputs.ee }}
        working-directory: ./tests/playwright
        run: E2E_DB_TYPE=${{ inputs.db }} pnpm run ci:test:ce:shard:${{ inputs.shard }}
        timeout-minutes: 60

      - name: Fetch develop branch
        working-directory: ./tests/playwright
        run: git fetch origin develop --depth=1

      - name: Stress test
        working-directory: ./tests/playwright
        run: E2E_DB_TYPE=${{ inputs.db }} node ./scripts/stressTestNewlyAddedTest.js

      - name: Run quick server and tests (pg)
        if: ${{ inputs.ee && inputs.db == 'sqlite' && inputs.shard == '1' }}
        working-directory: ./packages/nocodb
        run: |
          kill -9 $(lsof -t -i:8080) || true
          pnpm run watch:run:playwright:pg:cyquick &

      - name: Run quick server and tests (sqlite)
        if: ${{ inputs.ee && inputs.db == 'sqlite' && inputs.shard == '2' }}
        working-directory: ./packages/nocodb
        run: |
          kill -9 $(lsof -t -i:8080) || true
          pnpm run watch:run:playwright:quick > quick_${{ inputs.shard }}_test_backend.log &

      - name: Wait for backend & run quick tests
        if: ${{ inputs.ee && inputs.db == 'sqlite' }}
        working-directory: ./tests/playwright
        timeout-minutes: 5
        run: |
          while ! curl --output /dev/null --silent --head --fail http://localhost:8080; do
            printf '.'
            sleep 2
          done
          PLAYWRIGHT_HTML_REPORT=playwright-report-quick pnpm run test:quick

      - name: Configure AWS credentials for artifact upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.ARTIFACTS_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ARTIFACTS_S3_SECRET_KEY }}
          aws-region: us-east-2

      - name: Upload Artifacts to S3
        if: always()
        working-directory: ./
        run: |
          s3_path="runs/${GITHUB_RUN_ID}/run-attempt/${GITHUB_RUN_ATTEMPT}/job_name/${GITHUB_JOB}-${{ inputs.shard }}/${RANDOM}-$(date +%s)"

          # Upload playwright reports if they exist
          if [ -d "./tests/playwright/playwright-report" ]; then
            aws s3 sync ./tests/playwright/playwright-report s3://nocohub-ci-artifacts/${s3_path}/playwright-report/
          else
            echo "playwright reports directory does not exist" | aws s3 cp - s3://nocohub-ci-artifacts/${s3_path}/playwright-report/index.html
          fi

          # Upload backend logs if they exist (as text/plain so they render in browser)
          LOG_FILE="${{ inputs.db }}_${{ inputs.shard }}_test_backend.log"
          if [ -f "./packages/nocodb/${LOG_FILE}" ]; then
            aws s3 cp ./packages/nocodb/${LOG_FILE} s3://nocohub-ci-artifacts/${s3_path}/${LOG_FILE} --content-type "text/plain; charset=utf-8"
          fi

          # Heap dumps (PG only) are streamed to S3 by the background uploader
          # started in "Stream heap dumps to S3 in background". Stop it now and
          # flush any remaining files (heap profile is only written on process
          # exit, so it usually lands here, not via the streamer).
          STREAM_PREFIX="runs/${GITHUB_RUN_ID}/run-attempt/${GITHUB_RUN_ATTEMPT}/job_name/${GITHUB_JOB}-${{ inputs.shard }}/heap"
          if [ -f /tmp/heap-streamer.pid ]; then
            kill "$(cat /tmp/heap-streamer.pid)" 2>/dev/null || true
          fi
          shopt -s nullglob
          for f in ./packages/nocodb/Heap.*.heapsnapshot ./packages/nocodb/heap-profiles/*.heapprofile ./packages/nocodb/heap-profiles/*.heapsnapshot; do
            [ -f "$f" ] || continue
            [ -f "${f}.uploaded" ] && continue
            gzip -f "$f" 2>/dev/null && \
              aws s3 cp "${f}.gz" "s3://nocohub-ci-artifacts/${STREAM_PREFIX}/$(basename ${f}.gz)" --content-type "application/gzip" && \
              rm -f "${f}.gz"
          done
          shopt -u nullglob

          HEAP_SECTION=""
          if aws s3 ls "s3://nocohub-ci-artifacts/${STREAM_PREFIX}/" >/dev/null 2>&1; then
            HEAP_SECTION="
          [heap-dumps](https://nocohub-ci-artifacts.s3.us-east-2.amazonaws.com/?prefix=${STREAM_PREFIX}/)"
          fi

          SUMMARY="[backend-logs](https://nocohub-ci-artifacts.s3.us-east-2.amazonaws.com/${s3_path}/${LOG_FILE})
          [playwright-report](https://nocohub-ci-artifacts.s3.us-east-2.amazonaws.com/${s3_path}/playwright-report/index.html)${HEAP_SECTION}"
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
