name: Pre-build for Playwright tests

on:
  workflow_call:

jobs:
  build-ui:
    runs-on: ubicloud-standard-8
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'pnpm'

      - name: Set CI env
        run: export CI=true

      - name: Set NC Edition
        run: export EE=true

      - name: remove use-node-version line from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc

      - name: install dependencies
        run: pnpm bootstrap

      - name: Build UI
        working-directory: ./packages/nc-gui
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export NUXT_PUBLIC_ENV=CI
          pnpm run build:ee

      - name: Create build archive
        working-directory: ./packages/nc-gui
        run: |
          FILE="$(echo ${GITHUB_REPOSITORY} | sed "s,/,-,g")-${GITHUB_RUN_ID}.zip"
          zip -r ${FILE} ee/.output || echo "UI build directory does not exists" >&2
          echo "ARCHIVE_NAME=${FILE}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ARTIFACTS_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ARTIFACTS_S3_SECRET_KEY }}
          aws-region: us-east-2

      - name: Upload UI build to S3
        working-directory: ./packages/nc-gui
        run: |
          aws s3 cp ${ARCHIVE_NAME} s3://nocohub-ci-artifacts/ui-builds/${ARCHIVE_NAME}
          echo "s3://nocohub-ci-artifacts/ui-builds/${ARCHIVE_NAME}"
