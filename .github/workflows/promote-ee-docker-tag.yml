name: "Promote Docker tag"

on:
  workflow_dispatch:
    inputs:
      sourceRepo:
        description: "Source Docker repo"
        required: true
        default: "nocodb/nocodb-ee"
        type: choice
        options:
          - nocodb/nocodb-ee
          - nocodb/nocodb
      sourceTag:
        description: "Existing tag to promote (e.g. 2026.03.1)"
        required: true
      targetRepo:
        description: "Target Docker repo"
        required: true
        default: "nocodb/nocodb-ee"
        type: choice
        options:
          - nocodb/nocodb-ee
          - nocodb/nocodb
      targetTag:
        description: "Target tag to create"
        required: true
        default: "latest"

jobs:
  promote:
    runs-on: ubicloud-standard-2
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote ${{ inputs.sourceRepo }}:${{ inputs.sourceTag }} → ${{ inputs.targetRepo }}:${{ inputs.targetTag }}
        run: |
          docker buildx imagetools create \
            ${{ inputs.sourceRepo }}:${{ inputs.sourceTag }} \
            --tag ${{ inputs.targetRepo }}:${{ inputs.targetTag }}
