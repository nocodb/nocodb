name: "Cloud : Docker Deploy Production"

on:
  # Triggered manually
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote ws-pre-release(staging) to ws'
        required: false
        default: 'false'
      triggerOnPremBuild:
        description: 'Also trigger on-prem daily docker build (nocodb/nocodb-daily)'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'


jobs:
  promote-and-deploy:
    runs-on: ubicloud-standard-2
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      PROMOTE_READY_BEFORE_ROLLOUT: ${{ github.event.inputs.promote }}
      API_CREDENTIALS: ${{ secrets.PROD_ADMIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run promote script
        run: |
          ./scripts/release/production.sh ${{ github.event.inputs.promote }}

  trigger-onprem-build:
    if: ${{ github.event.inputs.triggerOnPremBuild == 'true' }}
    uses: ./.github/workflows/release-ee-on-prem-pr-build.yml
    secrets: inherit
