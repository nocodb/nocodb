name: "Release : Docker"

on:
  # Triggered manually
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
      targetEnv:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - DEV
          - PROD
  # Triggered by release-nocodb.yml / release-nightly-dev.yml / release-pr.yml
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        type: string
      targetEnv:
        description: "Target Environment"
        required: true
        type: string
      isDaily:
        description: "Is it triggered by daily schedule"
        required: false
        type: string
      currentVersion:
        description: "The current NocoDB version"
        required: false
        type: string

jobs:
  buildx:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      working-directory: ./packages/nocodb
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get Docker Repository
        id: get-docker-repository
        run: |
          TARGET_ENV=${{ github.event.inputs.targetEnv || inputs.targetEnv }}
          IS_DAILY=${{ inputs.isDaily || 'N' }}

          if [[ "$TARGET_ENV" == 'PROD' ]]; then
            DOCKER_REPOSITORY=nocodb
            DOCKERFILE=Dockerfile
            PLATFORMS="linux/amd64,linux/arm64,linux/arm/v7"
          elif [[ "$IS_DAILY" == 'Y' ]]; then
            DOCKER_REPOSITORY=nocodb-daily
            DOCKERFILE=Dockerfile.timely
            PLATFORMS="linux/amd64,linux/arm64"
          else
            DOCKER_REPOSITORY=nocodb-timely
            DOCKERFILE=Dockerfile.timely
            PLATFORMS="linux/amd64,linux/arm64"
          fi

          DOCKER_BUILD_TAG=${{ github.event.inputs.tag || inputs.tag }}
          DOCKER_BUILD_LATEST_TAG=latest

          if [[ "$DOCKER_BUILD_TAG" =~ "-beta." ]]; then
            DOCKER_BUILD_LATEST_TAG=$(echo $DOCKER_BUILD_TAG | awk -F '-beta.' '{print $1}')-beta.latest
          fi

          if [[ "$TARGET_ENV" == 'DEV' ]]; then
            CURRENT_VERSION=${{ github.event.inputs.currentVersion || inputs.currentVersion || 'N/A' }}
            if [[ "$CURRENT_VERSION" != 'N/A' ]]; then
              DOCKER_BUILD_TAG=${CURRENT_VERSION}-${DOCKER_BUILD_TAG}
            fi
          fi

          echo "DOCKER_REPOSITORY=${DOCKER_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "DOCKER_BUILD_TAG=${DOCKER_BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "DOCKER_BUILD_LATEST_TAG=${DOCKER_BUILD_LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "DOCKERFILE=${DOCKERFILE}" >> $GITHUB_OUTPUT
          echo "PLATFORMS=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "TARGET_ENV=${TARGET_ENV}" >> $GITHUB_OUTPUT

          echo "DOCKER_REPOSITORY: ${DOCKER_REPOSITORY}"
          echo "DOCKER_BUILD_TAG: ${DOCKER_BUILD_TAG}"
          echo "DOCKER_BUILD_LATEST_TAG: ${DOCKER_BUILD_LATEST_TAG}"
          echo "DOCKERFILE: ${DOCKERFILE}"
          echo "PLATFORMS: ${PLATFORMS}"

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Build SDK and GUI
        run: |
          export NODE_OPTIONS="--max_old_space_size=16384"
          pnpm --filter=nocodb-sdk run build
          pnpm --filter=nc-gui run build:copy

      - name: Build integrations (PROD only)
        if: ${{ (github.event.inputs.targetEnv || inputs.targetEnv) == 'PROD' }}
        working-directory: ${{ env.working-directory }}
        run: |
          cd ../noco-integrations/core
          pnpm install
          cd ../../..
          pnpm run integrations:build && pnpm run registerIntegrations

      - name: Build nocodb (PROD)
        if: ${{ (github.event.inputs.targetEnv || inputs.targetEnv) == 'PROD' }}
        working-directory: ${{ env.working-directory }}
        run: |
          pnpm run docker:build
          pnpm uninstall --save-prod nocodb-sdk knex-databricks knex-snowflake

      - name: Build nocodb (DEV)
        if: ${{ (github.event.inputs.targetEnv || inputs.targetEnv) == 'DEV' }}
        run: |
          # Generate and copy GUI to docker directory
          cd packages/nc-gui
          pnpm run generate
          rsync -rvzh ./dist/ ../nocodb/docker/nc-gui/

          # Build nocodb with timely config
          cd ../nocodb
          EE=true pnpm exec rspack --config rspack.timely.config.js
          pnpm uninstall --save-prod nocodb-sdk

          # Update version in package.json
          jq --arg VERSION "${{ steps.get-docker-repository.outputs.DOCKER_BUILD_TAG }}" '.version = $VERSION' package.json > tmp.json
          mv tmp.json package.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2.1.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2.2.1

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3.2.0
        with:
          context: ${{ env.working-directory }}
          file: ${{ env.working-directory }}/${{ steps.get-docker-repository.outputs.DOCKERFILE }}
          build-args: NC_VERSION=${{ steps.get-docker-repository.outputs.DOCKER_BUILD_TAG }}
          platforms: ${{ steps.get-docker-repository.outputs.PLATFORMS }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.get-docker-repository.outputs.DOCKER_REPOSITORY }}:${{ steps.get-docker-repository.outputs.DOCKER_BUILD_TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.get-docker-repository.outputs.DOCKER_REPOSITORY }}:${{ steps.get-docker-repository.outputs.DOCKER_BUILD_LATEST_TAG }}

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
