name: "Enterprise : On-prem PR / Daily Docker build"

# This workflow builds the Enterprise Edition on-prem Docker image as a "daily/PR" build
# and pushes it to the `nocodb/nocodb-daily` Docker Hub repository.
#
# Three triggers are supported:
#   1. workflow_dispatch (manual) — caller provides a `version` input and the image is
#      pushed as `nocodb/nocodb-daily:<version>`.
#   2. pull_request labeled with `on-prem-build` — image is built for the PR head commit
#      and pushed with an auto-generated tag, then a comment with the pull command is
#      added to the PR.
#   3. workflow_call — invoked by another workflow (e.g. cloud production deploy). If no
#      `version` is supplied, an auto-generated `<YYYY.MM.DD>.<HHMM>` tag is used.
#
# Tag format (single tag pushed per build):
#   - PR labeled:    pr-<PR_NUMBER>-<YYYY.MM.DD.HHMM>
#   - workflow_call: daily-<YYYY.MM.DD.HHMM>
#   - dispatch:      caller-supplied
#
# Both auto-generated tags lead with a channel prefix (`pr-N` / `daily`) so they
# group naturally in the docker registry, and append `<YYYY.MM.DD.HHMM>` so re-runs
# on the same day produce distinct tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag to publish (e.g. 2026.05.01-test or pr-1234.20260501.1530)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Docker image tag to publish (optional — auto-generated if omitted)"
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      NUXT_CHATWOOT_WEBSITE_TOKEN_ONPREM:
        required: false
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  buildx:
    # Run unless this is a PR event without the `on-prem-build` label.
    # Always runs for workflow_dispatch and workflow_call.
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'on-prem-build' }}
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    env:
      working-directory: ./packages/nocodb
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: 'pnpm'

      # Resolve the single docker tag we will publish.
      # - Caller-supplied version (dispatch or workflow_call):    use as-is.
      # - PR labeled:                                             pr-<num>-<YYYY.MM.DD.HHMM>.
      # - workflow_call without version (e.g. prod deploy):       daily-<YYYY.MM.DD.HHMM>.
      - name: Resolve docker tag
        id: resolve-tag
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.version || inputs.version }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          STAMP=$(date -u +"%Y.%m.%d.%H%M")

          if [ -n "$PROVIDED_VERSION" ]; then
            PRIMARY_TAG="$PROVIDED_VERSION"
          elif [ -n "$PR_NUMBER" ]; then
            PRIMARY_TAG="pr-${PR_NUMBER}-${STAMP}"
          else
            PRIMARY_TAG="daily-${STAMP}"
          fi
          echo "PRIMARY_TAG=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "Primary tag: ${PRIMARY_TAG}"

      - name: remove use-node-version line from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc

      - name: Cache integration dists
        uses: actions/cache@v4
        with:
          path: |
            packages/noco-integrations/packages/*/dist
            packages/noco-integrations/core/dist
            packages/noco-integrations/.build-checksums.json
          key: integrations-dist-${{ hashFiles('packages/noco-integrations/packages/*/src/**', 'packages/noco-integrations/core/src/**', 'packages/noco-integrations/packages/*/package.json') }}
          restore-keys: |
            integrations-dist-

      - name: install dependencies
        run: pnpm bootstrap

      - name: Set outputs
        id: vars
        run: echo "release_version=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create nc.txt version identifier file
        run: |
          mkdir -p packages/nc-gui/build/${{ steps.vars.outputs.release_version }}
          echo "User: ${{ github.actor }}" >> packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt
          echo "Commit: ${{ github.sha }}" >> packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt
          echo "Branch: ${{ github.ref }}" >> packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt
          echo "Action ID: ${{ github.run_id }}" >> packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt
          echo "Tag: ${{ steps.resolve-tag.outputs.PRIMARY_TAG }}" >> packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt
          date >> packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt
          cp packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt ./packages/nocodb/src/public/
          cp packages/nc-gui/build/${{ steps.vars.outputs.release_version }}/nc.txt ./packages/nc-sql-executor/src/public/nc.txt

      - name: build nc-gui and copy to nocodb
        env:
          NC_ON_PREM: true
          NUXT_CHATWOOT_WEBSITE_TOKEN: ${{ secrets.NUXT_CHATWOOT_WEBSITE_TOKEN_ONPREM }}
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          cd packages/nc-gui &&
          pnpm run generate:ee &&

          find ./ee/dist/ -type f -name '*.js.map' -delete &&
          find ./ee/dist/ -type f -name '*.css.map' -delete &&

          rsync -rvzh ./ee/dist/ ../nocodb/docker/nc-gui/

      - name: build nocodb
        run: |
          cd packages/nocodb &&
          EE=true pnpm exec rspack --config rspack.ee-on-prem.config.js &&
          pnpm uninstall --save-prod nocodb-sdk knex-snowflake knex-databricks

      - name: Stamp version into package.json
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.resolve-tag.outputs.PRIMARY_TAG }}\"/g" ./packages/nocodb/package.json
          echo "Stamped version: ${{ steps.resolve-tag.outputs.PRIMARY_TAG }}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-onprem-daily-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-onprem-daily-

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: "./packages/nocodb/src/ee-on-prem/Dockerfile-on-prem"
          context: "./packages/nocodb"
          platforms: linux/amd64,linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          push: true
          tags: |
            nocodb/nocodb-daily:${{ steps.resolve-tag.outputs.PRIMARY_TAG }}

      # https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Find existing PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- on-prem-pr-build -->'

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- on-prem-pr-build -->
            ### On-prem PR build ready

            **Image:** `nocodb/nocodb-daily:${{ steps.resolve-tag.outputs.PRIMARY_TAG }}`

            Pull it with:
            ```bash
            docker pull nocodb/nocodb-daily:${{ steps.resolve-tag.outputs.PRIMARY_TAG }}
            ```

            Run it locally:
            ```bash
            docker run -d --name nocodb-pr -p 8080:8080 nocodb/nocodb-daily:${{ steps.resolve-tag.outputs.PRIMARY_TAG }}
            ```

            Built from commit `${{ github.event.pull_request.head.sha }}` ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
