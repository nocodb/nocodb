name: "Release : One Executables"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "CE version tag (e.g. 0.302.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      NC_GITHUB_TOKEN1:
        required: true
      NUXT_CHATWOOT_WEBSITE_TOKEN_ONPREM:
        required: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Prep — heavy one-time setup (bootstrap, rspack, sqlite3 prebuilds,
  #               modclean) shared by every platform's pkg invocation.
  #               Uploads the prepared `scripts/pkg-executable/` directory as
  #               an artifact for the matrix to consume.
  # ---------------------------------------------------------------------------
  prep:
    runs-on: ubicloud-standard-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: 'pnpm'

      - name: Remove use-node-version from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Download GUI artifacts from build-common
        uses: actions/download-artifact@v4
        with:
          name: build-common-artifacts
          path: packages/nocodb/

      - name: Build nocodb for executables
        run: |
          cd packages/nocodb &&
          NODE_OPTIONS=--max-old-space-size=4096 EE=true pnpm exec rspack --config rspack.one-executable.config.js

      - name: Update package.json version to CE tag
        run: |
          CE_TAG="${{ github.event.inputs.tag || inputs.tag }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${CE_TAG}\"/g" ./packages/nocodb/package.json
          echo "Set nocodb package.json version to ${CE_TAG}"

      - name: Prepare nocodb tarball for pkg-executable
        run: |
          cd packages/nocodb

          # Strip pnpm-specific deps (link:, workspace:) and already-bundled deps
          # from package.json before packing, so npm can resolve the rest
          node -e "
            const pkg = require('./package.json');
            for (const [k,v] of Object.entries(pkg.dependencies || {})) {
              if (String(v).startsWith('link:') || String(v).startsWith('workspace:')) {
                delete pkg.dependencies[k];
              }
            }
            delete pkg.dependencies['nocodb-sdk'];
            delete pkg.dependencies['knex-snowflake'];
            delete pkg.dependencies['knex-databricks'];
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

          npm pack --pack-destination /tmp/

          # Restore original package.json
          git checkout -- package.json

      - name: Prepare pkg-executable directory
        run: |
          cd scripts/pkg-executable

          # downgrade sqlite3 to 5.1.6 until build issues are resolved
          node ../downgradeSqlite.js

          # Point nocodb dependency to the local tarball so npm installs it
          # with all its production dependencies resolved properly
          TARBALL=$(ls /tmp/nocodb-*.tgz | head -1)
          node -e "
            const pkg = require('./package.json');
            pkg.dependencies['nocodb'] = '${TARBALL}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

          npm i

          # Overlay locally-built artifacts on top of the installed nocodb
          rm -rf node_modules/nocodb/dist
          cp -r ../../packages/nocodb/dist node_modules/nocodb/dist
          mkdir -p node_modules/nocodb/docker
          cp -r ../../packages/nocodb/docker/nc-gui node_modules/nocodb/docker/nc-gui

          # Convert ESM-only @csstools packages to CJS (pkg can't snapshot .mjs files)
          for pkg_dir in node_modules/@csstools/css-calc node_modules/@csstools/css-parser-algorithms node_modules/@csstools/css-tokenizer node_modules/@csstools/color-helpers node_modules/@csstools/css-color-parser; do
            if [ -f "$pkg_dir/dist/index.mjs" ]; then
              npx esbuild "$pkg_dir/dist/index.mjs" --bundle --format=cjs --platform=node --outfile="$pkg_dir/dist/index.cjs" '--external:@csstools/*'
              node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('$pkg_dir/package.json', 'utf8'));
                if (p.exports && p.exports['.']) { p.exports['.'].require = './dist/index.cjs'; p.exports['.'].default = './dist/index.cjs'; }
                p.main = './dist/index.cjs';
                fs.writeFileSync('$pkg_dir/package.json', JSON.stringify(p, null, 2));
              "
            fi
          done

          # Patch aws-jwt-verify subpath imports (pkg doesn't support #imports)
          for f in node_modules/aws-jwt-verify/dist/cjs/jwt-rsa.js node_modules/aws-jwt-verify/dist/cjs/jwk.js node_modules/aws-jwt-verify/dist/cjs/https.js node_modules/aws-jwt-verify/dist/cjs/jwt.js; do
            if [ -f "$f" ]; then
              sed -i 's|require("#node-web-compat")|require("./node-web-compat-node.js")|g' "$f"
            fi
          done

      - name: Build sqlite3 for all platforms
        run: |
          cd scripts/pkg-executable
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=win32 --fallback-to-build --target_arch=x64 --target_libc=unknown
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=win32 --fallback-to-build --target_arch=ia32 --target_libc=unknown
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=darwin --fallback-to-build --target_arch=x64 --target_libc=unknown
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=darwin --fallback-to-build --target_arch=arm64 --target_libc=unknown
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=linux --fallback-to-build --target_arch=x64 --target_libc=glibc
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=linux --fallback-to-build --target_arch=arm64 --target_libc=glibc
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=linux --fallback-to-build --target_arch=x64 --target_libc=musl
          ./node_modules/.bin/node-pre-gyp install --directory=./node_modules/sqlite3 --target_platform=linux --fallback-to-build --target_arch=arm64 --target_libc=musl

      - name: Clean up node_modules
        run: |
          cd scripts/pkg-executable
          # Remove overrides added by downgradeSqlite.js to avoid npx conflict
          node -e "const p=require('./package.json'); delete p.overrides; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2));"
          npx modclean --patterns="default:*" --ignore="nocodb/**,dayjs/**,express-status-monitor/**,sqlite3/**,jsdom/**,lru-cache/**,@csstools/**,@asamuzakjp/**" --run

      # Tarball into a single file — actions/upload-artifact with hundreds of
      # thousands of small files inside node_modules is painfully slow.
      - name: Pack pkg-executable directory
        run: |
          tar -cf /tmp/pkg-executable.tar -C scripts pkg-executable

      - name: Upload pkg-executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-executable-prep
          path: /tmp/pkg-executable.tar
          retention-days: 1

      # Pre-create the draft release so the 4 non-mac matrix entries don't
      # race trying to create it themselves; their gh-release uploads will
      # then just attach files to an existing draft.
      - name: Ensure draft release exists
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.NC_GITHUB_TOKEN1 }}
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || inputs.tag }}
          repository: nocodb/nocodb

  # ---------------------------------------------------------------------------
  # Job 2: Build a single platform executable. Runs in parallel for every
  #         target so wall-clock is bounded by the slowest target rather
  #         than the sum of all six.
  # ---------------------------------------------------------------------------
  build-executable:
    needs: prep
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            target: node24-macos-x64
            sharp_cpu: x64
            sharp_os: darwin
            output: Noco-macos-x64
            runner: ubicloud-standard-8
          - name: macos-arm64
            target: node24-macos-arm64
            sharp_cpu: arm64
            sharp_os: darwin
            output: Noco-macos-arm64
            runner: ubicloud-standard-8-arm
          - name: linux-x64
            target: node24-linux-x64
            sharp_cpu: x64
            sharp_os: linux
            output: Noco-linux-x64
            runner: ubicloud-standard-8
          - name: linux-arm64
            target: node24-linux-arm64
            sharp_cpu: arm64
            sharp_os: linux
            output: Noco-linux-arm64
            runner: ubicloud-standard-8-arm
          - name: win-x64
            target: node24-win-x64
            sharp_cpu: x64
            sharp_os: win32
            output: Noco-win-x64.exe
            runner: ubicloud-standard-8
          - name: win-arm64
            target: node24-win-arm64
            sharp_cpu: arm64
            sharp_os: win32
            output: Noco-win-arm64.exe
            runner: ubicloud-standard-8-arm
    steps:
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0

      - name: Download pkg-executable artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-executable-prep
          path: /tmp/

      - name: Unpack pkg-executable
        run: |
          mkdir -p scripts
          tar -xf /tmp/pkg-executable.tar -C scripts

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          # Salt by target — pkg downloads a separate base binary per target.
          # Each matrix entry only ever needs its own target's binary, so
          # keying per-target gives 100% hit rate after first build.
          key: pkg-cache-${{ matrix.target }}-v1
          restore-keys: |
            pkg-cache-${{ matrix.target }}-

      - name: Install ldid (mac targets only)
        if: startsWith(matrix.name, 'macos-')
        run: |
          git clone --depth=1 https://github.com/daeken/ldid.git /tmp/ldid
          cd /tmp/ldid
          ./make.sh
          sudo cp ./ldid /usr/local/bin

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Swap sharp for target platform
        run: |
          cd scripts/pkg-executable
          npm uninstall sharp
          npm install --cpu=${{ matrix.sharp_cpu }} --os=${{ matrix.sharp_os }} sharp

      - name: Build executable
        run: |
          cd scripts/pkg-executable
          export NODE_OPTIONS="--max-old-space-size=8192"
          pkg . --compress GZip -t ${{ matrix.target }} -o ${{ matrix.output }}

      # mac binaries go to the sign job via artifact; everything else uploads
      # straight to the GitHub draft release so we don't pay the cost of a
      # collector job re-uploading the same files.
      - name: Upload mac binary as artifact (feeds sign job)
        if: startsWith(matrix.name, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: noco-binary-${{ matrix.name }}
          path: scripts/pkg-executable/${{ matrix.output }}
          retention-days: 1

      - name: Upload non-mac binary to draft release
        if: ${{ !startsWith(matrix.name, 'macos-') }}
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.NC_GITHUB_TOKEN1 }}
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || inputs.tag }}
          repository: nocodb/nocodb
          files: scripts/pkg-executable/${{ matrix.output }}

  # ---------------------------------------------------------------------------
  # Job 3: Sign macOS executables
  # ---------------------------------------------------------------------------
  sign-mac-executables:
    runs-on: macos-latest
    needs: build-executable
    steps:
      - name: Download macOS binaries from matrix
        uses: actions/download-artifact@v4
        with:
          pattern: noco-binary-macos-*
          path: scripts/pkg-executable/mac-dist
          merge-multiple: true

      - name: Sign macOS executables
        run: |
          chmod +x ./scripts/pkg-executable/mac-dist/Noco-macos-arm64 ./scripts/pkg-executable/mac-dist/Noco-macos-x64
          /usr/bin/codesign --force -s - ./scripts/pkg-executable/mac-dist/Noco-macos-arm64 -v
          /usr/bin/codesign --force -s - ./scripts/pkg-executable/mac-dist/Noco-macos-x64 -v

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('{0}-signed', github.event.inputs.tag || inputs.tag) }}
          path: scripts/pkg-executable/mac-dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 4: Publish macOS executables and update Homebrew
  # ---------------------------------------------------------------------------
  publish-mac-executables-and-homebrew:
    needs: sign-mac-executables
    runs-on: ubuntu-22.04
    steps:
      - name: Download signed macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('{0}-signed', github.event.inputs.tag || inputs.tag) }}
          path: scripts/pkg-executable/mac-dist

      - name: Checkout homebrew-nocodb
        uses: actions/checkout@v5
        with:
          path: 'homebrew-nocodb'
          token: ${{ secrets.NC_GITHUB_TOKEN1 }}
          repository: 'nocodb/homebrew-nocodb'
          fetch-depth: 0

      - name: Compress files and calculate checksum
        id: compress
        run: |
          cd ./scripts/pkg-executable
          cp ./mac-dist/Noco-macos-x64 ./mac-dist/nocodb
          tar -czf ./mac-dist/nocodb.tar.gz ./mac-dist/nocodb
          rm ./mac-dist/nocodb
          echo "CHECKSUM=$(shasum -a 256 ./mac-dist/nocodb.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload macOS executables and tarball to draft release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.NC_GITHUB_TOKEN1 }}
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || inputs.tag }}
          repository: nocodb/nocodb
          files: |
            ./scripts/pkg-executable/mac-dist/Noco-macos-x64
            ./scripts/pkg-executable/mac-dist/Noco-macos-arm64
            ./scripts/pkg-executable/mac-dist/nocodb.tar.gz

      - name: Generate Homebrew formula and push
        run: |
          FORMULA_CLASS_STR=$(cat << EOF
          class Nocodb < Formula
            desc "NocoDB : Opensource smart spreadsheet"
            homepage "https://github.com/nocodb/nocodb"
            url "https://github.com/nocodb/nocodb/releases/download/${{ github.event.inputs.tag || inputs.tag }}/nocodb.tar.gz"
            sha256 "${{ steps.compress.outputs.CHECKSUM }}"
            license "MIT"
            version "${{ github.event.inputs.tag || inputs.tag }}"

            def install
              bin.install "nocodb"
            end
          end
          EOF
          )

          cd ./homebrew-nocodb

          printf "$FORMULA_CLASS_STR" > ./Formula/nocodb.rb

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git commit ./Formula/nocodb.rb -m "Automatic publish"
          git push
