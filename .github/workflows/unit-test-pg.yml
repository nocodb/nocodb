name: "Unit Test PG"

on:
  workflow_call:
    inputs:
      test_set:
        description: 'Test set number'
        required: false
        type: string
      no_prefix:
        description: 'Do not use prefix (use schema) during test'
        required: false
        type: boolean
  # Triggered manually
  workflow_dispatch:
    inputs:
      test_set:
        description: 'Test set number'
        required: false
        type: string
      no_prefix:
        description: 'Do not use prefix (use schema) during test'
        required: false
        type: boolean

jobs:
  unit-tests-pg:
    runs-on: ubicloud-standard-2
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'pnpm'
      - name: Set CI env
        run: export CI=true
      - name: Set NC Edition
        run: export EE=true
      - name: remove use-node-version line from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc
      - name: Cache integration dists
        uses: actions/cache@v4
        with:
          path: |
            packages/noco-integrations/packages/*/dist
            packages/noco-integrations/core/dist
            packages/noco-integrations/.build-checksums.json
          key: integrations-dist-${{ hashFiles('packages/noco-integrations/packages/*/src/**', 'packages/noco-integrations/core/src/**', 'packages/noco-integrations/packages/*/package.json') }}
          restore-keys: |
            integrations-dist-
      - name: install dependencies
        run: pnpm bootstrap
      - name: run sql-executor
        working-directory: ./packages/nc-sql-executor
        run: |
          pnpm run dev &
      - name: run unit tests
        working-directory: ./packages/nocodb
        run: |
          pnpm run test:unit:pg:ee${{ inputs.no_prefix && '-no-prefix' || '' }} --forbid-only ${{ inputs.test_set && '--test-set-' || '' }}${{ inputs.test_set }}
