name: "Unit Test SQLite (CE)"

on:
  workflow_call:
  # Triggered manually
  workflow_dispatch:

jobs:
  unit-tests-sqlite:
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'pnpm'
      - name: Set CI env
        run: export CI=true
      - name: remove use-node-version line from .npmrc
        run: sed -i '/^use-node-version/d' .npmrc
      - name: Cache integration dists
        uses: actions/cache@v4
        with:
          path: |
            packages/noco-integrations/packages/*/dist
            packages/noco-integrations/core/dist
            packages/noco-integrations/.build-checksums.json
          key: integrations-dist-${{ hashFiles('packages/noco-integrations/packages/*/src/**', 'packages/noco-integrations/core/src/**', 'packages/noco-integrations/packages/*/package.json') }}
          restore-keys: |
            integrations-dist-
      - name: install dependencies
        run: pnpm bootstrap
      - name: run unit tests
        working-directory: ./packages/nocodb
        run: |
          pnpm run test:unit --forbid-only
