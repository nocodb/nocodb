version: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: your_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass your_redis_password
    volumes:
      - redis_data:/data

  nocodb:
    image: nocodb/nocodb:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=nocodb&p=your_db_password&d=nocodb"
      NC_REDIS_URL: "redis://:your_redis_password@redis:6379/0"
      NC_REDIS_JOB_URL: "redis://:your_redis_password@redis:6379/1"
      NC_WORKER_CONTAINER: "false"
    ports:
      - "8080:8080"
    volumes:
      - nocodb_data:/usr/app/data

  nocodb-worker:
    image: nocodb/nocodb:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=nocodb&p=your_db_password&d=nocodb"
      NC_REDIS_URL: "redis://:your_redis_password@redis:6379/0"
      NC_REDIS_JOB_URL: "redis://:your_redis_password@redis:6379/1"
      NC_WORKER_CONTAINER: "true"

volumes:
  postgres_data:
  redis_data:
  nocodb_data: